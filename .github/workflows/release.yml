name: Release

# Triggered by a version tag (`v*`): gates first, then a cross-platform
# packaging matrix that publishes the artifacts to a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  release:
    name: Package ${{ matrix.target }}
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # electron-vite writes the main / preload / renderer bundles into `out/`.
      - run: pnpm build
      # `--publish always` uploads to the GitHub Release of the pushed tag.
      # electron-builder creates it as a public release (releaseType in
      # electron-builder.yml); the finalise job below also promotes any
      # pre-existing draft for this tag.
      - name: Build and publish to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --${{ matrix.target }} --publish always

  # electron-builder only applies `releaseType` when it creates the release, so a
  # draft left behind by an earlier run would stay hidden. Promote the tag's
  # release once every platform has uploaded its artifacts.
  finalize:
    name: Publish the GitHub Release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Make the tag's release public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
