name: Release

# Triggered by a version tag (`v*`), or manually through `workflow_dispatch`
# to re-run an existing tag without moving it: gates first, then a
# cross-platform packaging matrix that publishes the artifacts to the tag's
# single GitHub Release. Both paths resolve one RELEASE_TAG so every step
# (version assertion, release lookup/creation, upload, finalize) agrees.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (vMAJOR.MINOR.PATCH)'
        required: true
        default: 'v0.2.23'
        type: string

permissions:
  contents: write

env:
  # push supplies the pushed tag through github.ref_name; workflow_dispatch
  # runs from main, so the human-entered tag is the only source of truth there.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch runs from main, so reject a malformed tag before any
      # checkout; a well-formed but unknown tag fails the refs/tags checkout.
      - name: Validate the release tag
        run: |
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag (${RELEASE_TAG}) is not a valid vMAJOR.MINOR.PATCH tag; refusing to publish."
            exit 1
          fi
          echo "Release tag: ${RELEASE_TAG}"
      # Full history and tags are required by the read-only ancestry gate below.
      # The explicit ref makes a dispatch run build the requested tag instead of
      # the main branch it was started from; push runs resolve to the same tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Assert the release tag exists in the checkout
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" > /dev/null; then
            echo "::error::refs/tags/${RELEASE_TAG} is not present in this checkout; refusing to publish."
            exit 1
          fi
          echo "Checked out ${RELEASE_TAG} at $(git rev-parse HEAD)"
      # Read-only preflight, run before anything is installed or built: the
      # package version must be a strict MAJOR.MINOR.PATCH.
      - name: Preflight package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version (${version}) is not a valid semver MAJOR.MINOR.PATCH; refusing to publish."
            exit 1
          fi
          echo "package.json version: ${version}"
      # Read-only ancestry gate, run before anything is installed or built. The
      # previously published v0.1.2 tag must either be a strict ancestor of HEAD
      # (no rewritten history) or every commit reachable only from the tag must
      # be patch-equivalent in HEAD (`git cherry` prints `-`). The two tag-only
      # commits on the remote lightweight v0.1.2 are a cherry-equivalent replay:
      # nothing from the published release is lost. Every decision is logged per
      # commit; a `+`, an unreadable commit list, or a deleted release-critical
      # path fails closed. Nothing here mutates tags, refs or remotes.
      - name: Preflight v0.1.2 ancestry
        run: |
          set -uo pipefail
          tag='v0.1.2'
          if ! tag_type="$(git cat-file -t "${tag}" 2>/dev/null)"; then
            echo "::error::Tag ${tag} is not visible in this checkout; fetch-depth: 0 is required for the ancestry preflight."
            exit 1
          fi
          if ! tag_commit="$(git rev-parse --verify --quiet "${tag}^{commit}")"; then
            echo "::error::Tag ${tag} (${tag_type}) cannot be resolved to a commit; failing closed."
            exit 1
          fi
          case "${tag_type}" in
            tag) tag_kind='annotated' ;;
            commit) tag_kind='lightweight' ;;
            *) tag_kind='unknown' ;;
          esac
          echo "${tag} ref type=${tag_type} (${tag_kind}) commit=${tag_commit}"
          if ! ahead="$(git rev-list --count "${tag}..HEAD")"; then
            echo "::error::Could not count commits after ${tag}; failing closed."
            exit 1
          fi
          if ! behind="$(git rev-list --count "HEAD..${tag}")"; then
            echo "::error::Could not count commits reachable only from ${tag}; failing closed."
            exit 1
          fi
          echo "${tag}..HEAD commits=${ahead} HEAD..${tag} commits=${behind}"
          if [ "${ahead}" -le 0 ]; then
            echo "::error::HEAD has no commits after ${tag}; the release must carry the post-tag fixes."
            exit 1
          fi
          if [ "${behind}" -eq 0 ]; then
            echo "${tag} is a strict ancestor of HEAD; ancestry check passed."
            exit 0
          fi
          # Not a strict ancestor: every tag-only commit must be a patch already
          # present in HEAD, and must not delete a release-critical path.
          echo "${tag} is not a strict ancestor of HEAD (${behind} commits reachable only from the tag); checking per-commit patch equivalence."
          if ! tag_only="$(git rev-list "HEAD..${tag}")"; then
            echo "::error::Could not enumerate the commits reachable only from ${tag}; failing closed."
            exit 1
          fi
          if [ -z "${tag_only}" ]; then
            echo "::error::HEAD..${tag} reported ${behind} commits but none could be enumerated; failing closed."
            exit 1
          fi
          status=0
          while IFS= read -r sha; do
            if [ -z "${sha}" ]; then continue; fi
            if ! decision="$(git cherry HEAD "${sha}" | awk -v want="${sha}" '$2 == want { print $1 }')"; then
              echo "::error::git cherry HEAD ${sha} failed; cannot prove patch equivalence, failing closed."
              exit 1
            fi
            if [ -z "${decision}" ]; then
              echo "::error::git cherry HEAD ${sha} produced no decision; failing closed."
              exit 1
            fi
            echo "${tag}-only commit ${sha} cherry=${decision}"
            case "${decision}" in
              '-') ;;
              '+')
                echo "::error::${sha} is reachable only from ${tag} and its patch is not present in HEAD (git cherry '+'); refusing to publish a rewritten history."
                status=1
                ;;
              *)
                echo "::error::Unexpected git cherry decision '${decision}' for ${sha}; failing closed."
                status=1
                ;;
            esac
            if ! name_status="$(git diff-tree --no-commit-id --name-status -r -m --root "${sha}")"; then
              echo "::error::Could not read the diff of ${sha}; failing closed."
              exit 1
            fi
            while IFS=$'\t' read -r diff_status diff_path; do
              if [ -z "${diff_status:-}" ]; then continue; fi
              case "${diff_status}" in
                D*) ;;
                *) continue ;;
              esac
              case "${diff_path:-}" in
                .github/workflows/*|build/*|electron-builder.yml|package.json)
                  echo "::error::${sha} deletes the release-critical path ${diff_path}; refusing to publish."
                  status=1
                  ;;
              esac
            done <<< "${name_status}"
          done <<< "${tag_only}"
          if [ "${status}" -ne 0 ]; then
            exit 1
          fi
          echo "All ${tag}-only commits are patch-equivalent in HEAD; ancestry check passed."
      # Fail before anything is built when the tag and the package version drift:
      # the tag's semantic version (minus the `v` prefix) must equal
      # package.json#version, otherwise the release would ship mismatched assets.
      - name: Assert the tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${RELEASE_TAG#v}"
          echo "tag=${RELEASE_TAG} package.json=${version}"
          if [ "${version}" != "${tag}" ]; then
            echo "::error::package.json version (${version}) does not match tag ${RELEASE_TAG}; bump the version or move the tag."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Same-image pre-tag evidence: the failing-path `process-exited` case is
      # repeated 50 times on this exact runner before the coverage build. Any
      # red round fails the gates job, so a release tag can only be pushed
      # after the soak is green on the release image.
      - name: Spike process-tree soak (same image)
        run: pnpm test:soak -- --rounds=50
      # Release-only coverage floor gate: `src/core/**` floors are pinned once
      # per release and compared against a summary produced by this job. The
      # gate is never part of the delivery matrix (.munk/code-gates.json).
      - name: Coverage gate (src/core floors)
        run: |
          set -euo pipefail
          summary_dir="${RUNNER_TEMP}/coverage-gate"
          rm -rf "${summary_dir}"
          mkdir -p "${summary_dir}"
          include='src/core/**'
          exclude=('**/*.test.ts' '**/*.test.tsx' '**/__fixtures__/**')
          started_at="$(date +%s)"
          pnpm exec vitest run --coverage \
            --coverage.provider=v8 \
            --coverage.include="${include}" \
            --coverage.exclude="${exclude[0]}" \
            --coverage.exclude="${exclude[1]}" \
            --coverage.exclude="${exclude[2]}" \
            --coverage.reporter=json-summary \
            --coverage.reportsDirectory="${summary_dir}"
          node scripts/coverage-gate.mjs \
            --summary "${summary_dir}/coverage-summary.json" \
            --started-at "${started_at}" \
            --include "${include}" \
            --exclude "${exclude[0]}" \
            --exclude "${exclude[1]}" \
            --exclude "${exclude[2]}"
      - run: pnpm build
      # Create the tag's GitHub Release exactly once, before the packaging
      # matrix starts. Letting each platform's electron-builder publish
      # concurrently raced into several same-named releases for one tag, which
      # split the uploaded assets across them. The matrix now uploads into this
      # single release instead. Any duplicate releases left behind by an earlier
      # race are pruned so exactly one remains for the tag.
      # The release body comes from the repository's own bilingual release notes
      # for the checked-out tag plus a Full Changelog link. Both language files
      # are required: a missing or empty file on either side fails closed before
      # any draft is created or edited, so a single-language body can never ship.
      - name: Pre-create the tag's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(node -p "require('./package.json').version")"
          notes_file="docs/release-notes/v${version}.md"
          notes_zh_file="docs/release-notes/v${version}.zh-CN.md"
          if [ ! -f "${notes_file}" ]; then
            echo "::error::Missing release notes ${notes_file} (English); refusing to publish without a bilingual release body."
            exit 1
          fi
          if [ -z "$(tr -d '[:space:]' < "${notes_file}")" ]; then
            echo "::error::Release notes ${notes_file} are empty (English); refusing to publish without a bilingual release body."
            exit 1
          fi
          if [ ! -f "${notes_zh_file}" ]; then
            echo "::error::Missing release notes ${notes_zh_file} (Simplified Chinese); refusing to publish without a bilingual release body."
            exit 1
          fi
          if [ -z "$(tr -d '[:space:]' < "${notes_zh_file}")" ]; then
            echo "::error::Release notes ${notes_zh_file} are empty (Simplified Chinese); refusing to publish without a bilingual release body."
            exit 1
          fi

          last="$(gh release list --exclude-drafts --limit 100 --json tagName \
            --jq "[.[] | select(.tagName != \"${RELEASE_TAG}\")][0].tagName // \"\"")"
          if [ -z "${last}" ]; then
            echo "::error::Could not resolve the previous published release before ${RELEASE_TAG}; refusing to publish without a changelog base."
            exit 1
          fi

          body_file="${RUNNER_TEMP}/release-body-${RELEASE_TAG}.md"
          {
            cat "${notes_file}"
            echo
            echo '---'
            echo '<details><summary>简体中文</summary>'
            echo
            cat "${notes_zh_file}"
            echo
            echo '</details>'
            echo
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${last}...${RELEASE_TAG}"
          } > "${body_file}"

          readarray -t ids < <(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .id")

          if [ "${#ids[@]}" -eq 0 ]; then
            echo "No release for ${RELEASE_TAG}; creating a draft."
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TAG}" \
              --draft \
              --notes-file "${body_file}"
          else
            echo "Keeping release ${ids[0]} for ${RELEASE_TAG}."
            for id in "${ids[@]:1}"; do
              echo "Pruning duplicate release ${id} for ${RELEASE_TAG}."
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            done
            if [ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${ids[0]}" --jq '.draft')" = "true" ]; then
              echo "Release ${ids[0]} for ${RELEASE_TAG} is still a draft; updating its body."
              gh release edit "${RELEASE_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --notes-file "${body_file}"
            else
              echo "Release ${ids[0]} for ${RELEASE_TAG} is already public; leaving its body untouched."
            fi
          fi

  release:
    name: Package ${{ matrix.target }}
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      # Dispatch runs start on main; package the tag the gates validated.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # electron-vite writes the main / preload / renderer bundles into `out/`.
      - run: pnpm build
      # Fail closed on macOS: never let electron-builder silently skip code
      # signing and ship an unsigned bundle. The Developer ID certificate and the
      # App Store Connect API key credentials are human-entered GitHub Secrets;
      # until all six exist this step aborts the run (see docs/release-signing.md).
      - name: Require macOS signing and notarization credentials
        if: matrix.target == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then missing+=("${name}"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing macOS signing/notarization secrets: ${missing[*]}. Refusing to build an unsigned macOS bundle (fail-closed); see docs/release-signing.md."
            exit 1
          fi
      # electron-builder / @electron/notarize hand the App Store Connect key to
      # `notarytool --key`, which expects a .p8 file path. Decode the base64
      # secret into a 0600 file outside the checkout; the key material is never
      # echoed to the log.
      - name: Materialize the App Store Connect API key
        if: matrix.target == 'mac'
        id: api-key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          key_path="${RUNNER_TEMP}/opencompare-appstoreconnect.p8"
          printf '%s' "${APPLE_API_KEY}" | base64 --decode > "${key_path}"
          chmod 600 "${key_path}"
          if [ ! -s "${key_path}" ]; then
            echo "::error::APPLE_API_KEY did not decode to a non-empty .p8 file; refusing to build an unnotarized bundle."
            exit 1
          fi
          echo "key-path=${key_path}" >> "${GITHUB_OUTPUT}"
      # Package locally only: publishing is deferred to the upload step below so
      # the three platforms never create the GitHub Release concurrently. The mac
      # step signs (CSC_LINK / CSC_KEY_PASSWORD) and notarizes (APPLE_API_KEY /
      # APPLE_API_KEY_ID / APPLE_API_ISSUER) the bundle. The Developer ID
      # certificate must never reach win/linux: electron-builder would sign the
      # Windows PE with it, and Windows reports that untrusted signature as
      # UnknownError (see docs/release-signing.md §七).
      - name: Build installers
        env:
          CSC_LINK: ${{ matrix.target == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ steps.api-key.outputs.key-path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm exec electron-builder --${{ matrix.target }} --publish never
      - name: Remove the temporary App Store Connect API key
        if: matrix.target == 'mac' && always()
        env:
          APPLE_API_KEY: ${{ steps.api-key.outputs.key-path }}
        run: |
          if [ -n "${APPLE_API_KEY}" ]; then rm -f "${APPLE_API_KEY}"; fi
      # The packaged bundle is the release surface, so prove it carries the brand
      # icon and the tag identity before any artifact can be uploaded. Locate the
      # real bundle instead of assuming an architecture directory.
      - name: Locate the packaged app and assert its icon and version
        if: matrix.target == 'mac'
        shell: bash
        run: |
          tag="${RELEASE_TAG#v}"
          app="$(find release -maxdepth 2 -name 'OpenCompare.app' -type d -print -quit)"
          if [ -z "${app}" ]; then
            echo "::error::No OpenCompare.app found under release/; refusing to upload an unverified macOS bundle."
            exit 1
          fi
          plist="${app}/Contents/Info.plist"
          if [ ! -f "${plist}" ]; then
            echo "::error::Missing ${plist}; refusing to upload an unverified macOS bundle."
            exit 1
          fi
          if ! icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "${plist}")"; then
            echo "::error::Could not read CFBundleIconFile from ${plist}."
            exit 1
          fi
          if [ -z "${icon_name}" ] || [ "${icon_name}" = "electron.icns" ]; then
            echo "::error::CFBundleIconFile is '${icon_name}'; expected a non-Electron brand icon."
            exit 1
          fi
          icon_resource="${app}/Contents/Resources/${icon_name}"
          if [ ! -f "${icon_resource}" ]; then
            case "${icon_name}" in
              *.*) ;;
              *) icon_resource="${icon_resource}.icns" ;;
            esac
          fi
          if [ ! -s "${icon_resource}" ]; then
            echo "::error::Packaged icon ${icon_resource} (CFBundleIconFile=${icon_name}) is missing or empty."
            exit 1
          fi
          if [ "$(head -c 4 "${icon_resource}")" != "icns" ]; then
            echo "::error::Packaged icon ${icon_resource} does not start with the 'icns' magic."
            exit 1
          fi
          packaged_icon_sha="$(shasum -a 256 "${icon_resource}" | cut -d ' ' -f 1)"
          electron_icns=""
          for candidate in \
            "node_modules/electron/dist/Electron.app/Contents/Resources/electron.icns" \
            "node_modules/electron/dist/resources/electron.icns"; do
            if [ -f "${candidate}" ]; then
              electron_icns="${candidate}"
              break
            fi
          done
          if [ -n "${electron_icns}" ]; then
            default_icon_sha="$(shasum -a 256 "${electron_icns}" | cut -d ' ' -f 1)"
            if [ "${packaged_icon_sha}" = "${default_icon_sha}" ]; then
              echo "::error::Packaged icon ${icon_resource} is the Electron default icon (sha256 ${packaged_icon_sha})."
              exit 1
            fi
          else
            echo "Electron default electron.icns not found; skipping the SHA-256 default-icon comparison."
          fi
          packaged_png="${app}/Contents/Resources/icon.png"
          if [ ! -s "${packaged_png}" ]; then
            echo "::error::Missing packaged ${packaged_png} (extraResources build/icon.png)."
            exit 1
          fi
          packaged_png_sha="$(shasum -a 256 "${packaged_png}" | cut -d ' ' -f 1)"
          repo_png_sha="$(shasum -a 256 build/icon.png | cut -d ' ' -f 1)"
          if [ "${packaged_png_sha}" != "${repo_png_sha}" ]; then
            echo "::error::Packaged icon.png (${packaged_png_sha}) does not match build/icon.png (${repo_png_sha})."
            exit 1
          fi
          if ! bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${plist}")"; then
            echo "::error::Could not read CFBundleIdentifier from ${plist}."
            exit 1
          fi
          if [ "${bundle_id}" != "com.opencompare.app" ]; then
            echo "::error::CFBundleIdentifier is '${bundle_id}', expected com.opencompare.app."
            exit 1
          fi
          if ! bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${plist}")"; then
            echo "::error::Could not read CFBundleShortVersionString from ${plist}."
            exit 1
          fi
          if [ "${bundle_version}" != "${tag}" ]; then
            echo "::error::CFBundleShortVersionString is '${bundle_version}', expected tag version ${tag}."
            exit 1
          fi
          echo "Verified ${app}: icon=${icon_name} bundle=${bundle_id} version=${bundle_version}"
      # Signed-but-not-notarized bundles are indistinguishable from unsigned ones
      # for the user, so verify the Developer ID signature, the stapled ticket
      # (falling back to the app inside the built dmg) and Gatekeeper acceptance.
      - name: Verify the app signature, notarization and Gatekeeper acceptance
        if: matrix.target == 'mac'
        shell: bash
        run: |
          set -uo pipefail
          app="$(find release -maxdepth 2 -name 'OpenCompare.app' -type d -print -quit)"
          if [ -z "${app}" ]; then
            echo "::error::No OpenCompare.app found under release/; refusing to upload an unverified macOS bundle."
            exit 1
          fi
          if ! codesign --verify --deep --strict --verbose=2 "${app}"; then
            echo "::error::codesign --verify --deep --strict failed for ${app}."
            exit 1
          fi
          if ! signature="$(codesign -dv --verbose=4 "${app}" 2>&1)"; then
            echo "::error::codesign -dv failed for ${app}."
            exit 1
          fi
          if ! grep -Fq 'Authority=Developer ID Application' <<< "${signature}"; then
            echo "::error::The app is not signed with a Developer ID Application certificate: ${signature}"
            exit 1
          fi
          if ! grep -Fq 'TeamIdentifier=3X4J53U6RY' <<< "${signature}"; then
            echo "::error::The app signature does not carry TeamIdentifier=3X4J53U6RY: ${signature}"
            exit 1
          fi
          if grep -Fq 'Signature=adhoc' <<< "${signature}"; then
            echo "::error::The app is ad-hoc signed (Signature=adhoc); refusing to upload it."
            exit 1
          fi
          if ! grep -Fq '(runtime)' <<< "${signature}"; then
            echo "::error::The app signature does not enable the hardened runtime flag (runtime): ${signature}"
            exit 1
          fi
          stapler_ok=0
          if xcrun stapler validate "${app}"; then
            stapler_ok=1
          fi
          if [ "${stapler_ok}" -ne 0 ]; then
            echo "Verified the notarization ticket on ${app}."
          else
            dmg="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
            if [ -z "${dmg}" ]; then
              echo "::error::${app} is not stapled and no .dmg is available to verify the notarization ticket."
              exit 1
            fi
            mount_dir="$(mktemp -d)"
            detach_dmg() { hdiutil detach "${mount_dir}" >/dev/null 2>&1; return 0; }
            trap detach_dmg EXIT
            if ! hdiutil attach -nobrowse -readonly -mountpoint "${mount_dir}" "${dmg}" >/dev/null; then
              echo "::error::Failed to mount ${dmg} to verify the notarization ticket."
              exit 1
            fi
            mounted_app="$(find "${mount_dir}" -maxdepth 2 -name 'OpenCompare.app' -type d -print -quit)"
            if [ -z "${mounted_app}" ]; then
              echo "::error::No OpenCompare.app inside ${dmg}."
              exit 1
            fi
            if ! xcrun stapler validate "${mounted_app}"; then
              echo "::error::Notarization ticket is missing for ${mounted_app} inside ${dmg}."
              exit 1
            fi
            detach_dmg
            trap - EXIT
            echo "Verified the notarization ticket inside ${dmg}."
          fi
          gatekeeper=""
          if ! gatekeeper="$(spctl -a -vv --type execute "${app}" 2>&1)"; then
            echo "::error::spctl rejected ${app}: ${gatekeeper}"
            exit 1
          fi
          if ! grep -Fq 'accepted' <<< "${gatekeeper}" || ! grep -Fq 'Notarized Developer ID' <<< "${gatekeeper}"; then
            echo "::error::spctl did not report an accepted, Notarized Developer ID app: ${gatekeeper}"
            exit 1
          fi
          echo "Verified ${app}: Developer ID signature, notarization ticket and Gatekeeper acceptance."
      # The packaged update metadata (latest*.yml) must carry the tag version so
      # the artifact names, the update feed and the release stay consistent. Every
      # artifact of this platform must be versioned, otherwise a stale build from
      # another version could be uploaded alongside it.
      - name: Assert packaged version matches the tag
        shell: bash
        run: |
          tag="${RELEASE_TAG#v}"
          shopt -s nullglob
          case "${{ matrix.target }}" in
            mac) required_exts=(dmg zip) ;;
            win) required_exts=(exe zip) ;;
            linux) required_exts=(AppImage deb) ;;
            *)
              echo "::error::Unknown matrix target '${{ matrix.target }}'; refusing to upload unverified artifacts." >&2
              exit 1
              ;;
          esac
          status=0
          for ext in "${required_exts[@]}"; do
            artifacts=(release/*."${ext}")
            if [ "${#artifacts[@]}" -eq 0 ]; then
              echo "::error::No .${ext} artifact found under release/ for the ${{ matrix.target }} target." >&2
              status=1
              continue
            fi
            for artifact in "${artifacts[@]}"; do
              name="$(basename "${artifact}")"
              name_versions=""
              if ! name_versions="$(printf '%s\n' "${name}" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)"; then
                name_versions=""
              fi
              if [ -z "${name_versions}" ]; then
                echo "::error::Artifact ${name} does not carry a MAJOR.MINOR.PATCH version." >&2
                status=1
                continue
              fi
              while IFS= read -r found_version; do
                if [ "${found_version}" != "${tag}" ]; then
                  echo "::error::Artifact ${name} carries version ${found_version}, which does not match tag ${RELEASE_TAG}." >&2
                  status=1
                fi
              done <<< "${name_versions}"
            done
          done
          files=(release/latest*.yml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No latest*.yml update metadata found under release/." >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            if ! FILE="${file}" TAG="${tag}" node -e '
              const fs = require("fs")
              const { parse } = require("yaml")
              const file = process.env.FILE
              const tag = process.env.TAG
              const metadata = parse(fs.readFileSync(file, "utf8")) || {}
              const problems = []
              if (String(metadata.version) !== tag) {
                problems.push(`version ${metadata.version} does not match tag ${tag}`)
              }
              if (metadata.path !== undefined && !String(metadata.path).includes(tag)) {
                problems.push(`path ${metadata.path} does not match tag ${tag}`)
              }
              for (const entry of metadata.files || []) {
                const url = String(entry.url || "")
                if (!url.includes(tag)) {
                  problems.push(`files[].url ${url} does not match tag ${tag}`)
                }
                if (entry.path !== undefined && !String(entry.path).includes(tag)) {
                  problems.push(`files[].path ${entry.path} does not match tag ${tag}`)
                }
              }
              if (problems.length > 0) {
                for (const problem of problems) console.error(`::error::${file} ${problem}.`)
                process.exit(1)
              }
              console.log(`${file} version=${metadata.version}`)
            '; then
              echo "::error::${file} update metadata does not match tag ${RELEASE_TAG}." >&2
              status=1
            fi
          done
          exit ${status}
      # The portable zip is a download, not an update payload: Windows
      # auto-update must keep resolving to the NSIS installer. electron-builder
      # writes latest.yml from the nsis target today, but the zip target is new,
      # so assert the feed instead of assuming it: a zip entry in files[] fails
      # the run rather than shipping an update that hands out an unpacked app.
      # Read-only and separate from the version/url gates above.
      - name: Assert the Windows update feed points at the NSIS installer
        if: matrix.target == 'win'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/latest*.yml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No latest*.yml update metadata found under release/." >&2
            exit 1
          fi
          status=0
          for file in "${files[@]}"; do
            if ! FILE="${file}" node -e '
              const fs = require("fs")
              const { parse } = require("yaml")
              const file = process.env.FILE
              const metadata = parse(fs.readFileSync(file, "utf8")) || {}
              const zipEntries = (metadata.files || [])
                .map((entry) => String(entry.url || ""))
                .filter((url) => url.toLowerCase().endsWith(".zip"))
              if (zipEntries.length > 0) {
                for (const url of zipEntries) {
                  console.error(`::error::${file} files[].url ${url} points at a portable zip; Windows auto-update must use the NSIS installer.`)
                }
                process.exit(1)
              }
              console.log(`${file} files[] carries no zip entry`)
            '; then
              echo "::error::${file} lists a .zip artifact; refusing a Windows update feed that is not the NSIS installer." >&2
              status=1
            fi
          done
          exit ${status}
      # electron-builder embeds the blockmap payload in the AppImage trailer and
      # ships no separate Linux blockmap artifact; latest-linux.yml records its
      # length as blockMapSize. Reject metadata whose declared length does not
      # match the archive's last 4 bytes read as both little-endian and
      # big-endian uint32, so an update client can never be handed a blockmap
      # the file does not carry.
      - name: Assert the AppImage embeds its declared blockmap
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(release/*.AppImage)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .AppImage under release/, found ${#images[@]}." >&2
            exit 1
          fi
          image="${images[0]}"
          metadata="release/latest-linux.yml"
          if [ ! -f "${metadata}" ]; then
            echo "::error::Missing ${metadata}; cannot verify the embedded AppImage blockmap." >&2
            exit 1
          fi
          IMAGE="${image}" IMAGE_NAME="$(basename "${image}")" METADATA="${metadata}" node -e '
            const fs = require("fs")
            const image = process.env.IMAGE || ""
            const wanted = process.env.IMAGE_NAME || ""
            const lines = fs.readFileSync(process.env.METADATA, "utf8").split(/\r?\n/)
            let current = ""
            let declared = ""
            for (const line of lines) {
              const entry = /^\s*-\s*url:\s*(.+?)\s*$/.exec(line)
              if (entry) {
                current = entry[1].replace(/^"|"$/g, "").replace(/^\.\//, "")
                continue
              }
              if (/^\S/.test(line)) {
                current = ""
                continue
              }
              const blockMap = /^\s*blockMapSize:\s*(\d+)\s*$/.exec(line)
              if (blockMap && current === wanted) {
                declared = blockMap[1]
                break
              }
            }
            if (!declared) {
              console.error("::error::latest-linux.yml has no blockMapSize for " + wanted + ".")
              process.exit(1)
            }
            const size = fs.statSync(image).size
            if (size < 4) {
              console.error("::error::" + image + " is smaller than 4 bytes.")
              process.exit(1)
            }
            const fd = fs.openSync(image, "r")
            const tail = Buffer.alloc(4)
            fs.readSync(fd, tail, 0, 4, size - 4)
            fs.closeSync(fd)
            const candidates = [tail.readUInt32LE(0), tail.readUInt32BE(0)]
            const inRange = candidates.filter((value) => value <= size)
            if (inRange.includes(Number(declared))) {
              console.log("Verified " + image + ": embedded blockMapSize=" + declared + " matches latest-linux.yml.")
              process.exit(0)
            }
            if (inRange.length === 0) {
              console.error("::error::" + image + " trailer candidates LE=" + candidates[0] + " BE=" + candidates[1] + " both exceed the file size " + size + ".")
              process.exit(1)
            }
            console.error("::error::" + image + " trailer candidates LE=" + candidates[0] + " BE=" + candidates[1] + " do not match latest-linux.yml blockMapSize=" + declared + ".")
            process.exit(1)
          '
      # Hash exactly the files the upload below sends, before anything leaves
      # this runner: the same `release/` directory and the same glob list the
      # script derives its matcher from. A file that cannot be read, a name that
      # is not a 64-char lowercase hex sha256 or a coverage mismatch fails here,
      # so the release matrix never uploads an unhashed asset.
      - name: Compute the build-time sha256 manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs --build-sha256-manifest --tag="${RELEASE_TAG}" --target="${{ matrix.target }}" --release-dir=release --out=sha256-manifest
      # The manifest travels as a workflow artifact only: it never becomes a
      # public release asset and is never part of `gh release upload` below.
      - name: Archive the build-time sha256 manifest
        uses: actions/upload-artifact@v4
        with:
          name: sha256-manifest-${{ env.RELEASE_TAG }}-${{ matrix.target }}
          path: sha256-manifest
          if-no-files-found: error
          retention-days: 30
      # Upload this platform's artifacts into the single pre-created release.
      # `shell: bash` guarantees globbing works on the windows runner too.
      - name: Upload installers to the tag's release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.deb release/*.blockmap release/latest*.yml)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release artifacts found under release/." >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber --repo "${GITHUB_REPOSITORY}"

  # The release stays a draft while the matrix uploads. Verification runs
  # against that draft first; only a 15/15 aggregate lets the release go public.
  finalize:
    name: Publish the GitHub Release
    needs: release
    runs-on: ubuntu-latest
    # A job-level block replaces the workflow-level one, so spell out both:
    # `contents: write` for the `gh release` calls and `actions: write` for the
    # `gh workflow run` dispatch. Dropping `contents` would lose the publish.
    permissions:
      contents: write
      actions: write
    steps:
      # The public L1 step below runs the same `scripts/verify-release.mjs` as
      # the draft verification, so the comparison rule exists once. Checkout and
      # node are read-only setup at the top of the job: the publish gate order
      # (resolve -> dispatch -> aggregate/artifact -> publish -> public checks)
      # is unchanged.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Read-only: the tag's release must exist exactly once, and its `draft`
      # flag decides which transport mode the verification run uses. A missing,
      # duplicate or non-boolean release state fails before anything is
      # dispatched or published.
      - name: Resolve the tag's release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          state_file="${RUNNER_TEMP}/release-state.txt"
          matches="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate | jq -s --arg tag "${RELEASE_TAG}" '[.[][] | select(.tag_name == $tag)]')"
          count="$(printf '%s' "${matches}" | jq 'length')"
          if [ "${count}" -ne 1 ]; then
            echo "::error::Expected exactly one release for ${RELEASE_TAG}, found ${count}." >&2
            exit 1
          fi
          release_id="$(printf '%s' "${matches}" | jq -r '.[0].id')"
          draft="$(printf '%s' "${matches}" | jq -r '.[0].draft')"
          case "${draft}" in
            true) mode="draft" ;;
            false) mode="published" ;;
            *)
              echo "::error::Release ${RELEASE_TAG} has a non-boolean draft flag '${draft}'." >&2
              exit 1
              ;;
          esac
          echo "${mode}" > "${state_file}"
          echo "release id: ${release_id} (draft=${draft}, verification mode=${mode})"
      # Publishing with GITHUB_TOKEN starts no `release: published` workflow, so
      # the verification has to be dispatched from here. This is why the job
      # declares `actions: write` on top of `contents: write`. The mode comes
      # from the resolved release state, so a draft is verified before publish.
      - name: Dispatch the post-release verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only a run created at or after this moment may satisfy the gate
          # below, so a dispatch re-run of an already verified tag cannot pass
          # on the older run. Two minutes of clock skew are allowed.
          since="$(date -u -d '2 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          echo "${since}" > "${RUNNER_TEMP}/post-release-verify-since.txt"
          mode="$(cat "${RUNNER_TEMP}/release-state.txt")"
          echo "验证模式: ${mode}"
          gh workflow run post-release-verify.yml -f tag="${RELEASE_TAG}" -f mode="${mode}" -f release_run_id="${GITHUB_RUN_ID}"
      # A dispatch that resolves to no run is the exact failure this workflow
      # used to ship: a release with zero verification. Look for the run-name
      # that carries this tag and fail closed after five minutes instead of
      # publishing silently unverified.
      - name: Find the post-release verification run for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id_file="${RUNNER_TEMP}/post-release-verify-run-id.txt"
          runs_file="${RUNNER_TEMP}/post-release-verify-runs.json"
          since="$(cat "${RUNNER_TEMP}/post-release-verify-since.txt")"
          rm -f "${run_id_file}"
          # Five minutes by default; the override exists so a headless test can
          # drive the miss branch without sleeping the whole window.
          lookup_seconds="${POST_RELEASE_LOOKUP_SECONDS:-300}"
          deadline=$((SECONDS + lookup_seconds))
          while :; do
            gh run list --workflow=post-release-verify.yml --event=workflow_dispatch --limit 100 --json databaseId,displayTitle,createdAt > "${runs_file}"
            run_id="$(jq -r --arg tag "${RELEASE_TAG}" --arg since "${since}" '[.[] | select((.displayTitle // "") | contains($tag)) | select(.createdAt >= $since)] | sort_by(.createdAt) | last | .databaseId // empty' "${runs_file}")"
            if [ -n "${run_id}" ]; then
              echo "Found post-release verification run ${run_id} for ${RELEASE_TAG}."
              echo "${run_id}" > "${run_id_file}"
              exit 0
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::No post-release-verify workflow_dispatch run for ${RELEASE_TAG} appeared within five minutes; the release is not published without verification." >&2
              exit 1
            fi
            sleep 15
          done
      # A dispatched run is not a verification. Follow the very run that carries
      # this tag to a successful `aggregate` job and to the aggregate artifact
      # named after this tag and this run id; both waits are bounded and time
      # out closed rather than passing on a pending run. A failure prints the
      # failing check names and the verify-out evidence before exiting, and
      # leaves the release a draft.
      - name: Assert the post-release verification aggregate passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id="$(cat "${RUNNER_TEMP}/post-release-verify-run-id.txt")"
          run_file="${RUNNER_TEMP}/post-release-verify-run.json"
          artifacts_file="${RUNNER_TEMP}/post-release-verify-artifacts.txt"
          evidence="${RUNNER_TEMP}/verify-out"
          deadline=$((SECONDS + 5400))
          while :; do
            gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --json status,jobs > "${run_file}"
            run_status="$(jq -r '.status // empty' "${run_file}")"
            aggregate="$(jq -r 'first(.jobs[] | select(.name == "aggregate") | (.conclusion // empty)) // empty' "${run_file}")"
            if [ "${aggregate}" = "success" ]; then
              break
            fi
            if [ "${aggregate}" = "failure" ] || [ "${aggregate}" = "cancelled" ] || [ "${aggregate}" = "timed_out" ]; then
              rm -rf "${evidence}"
              download_status=0
              gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" --name "post-release-verify-${RELEASE_TAG}-${run_id}-aggregate" --dir "${evidence}" || download_status=$?
              echo "aggregate artifact download exit: ${download_status}"
              if [ -f "${evidence}/summary.json" ]; then
                echo "aggregate summary status: $(jq -r '.status // "unknown"' "${evidence}/summary.json")"
                jq -r '(.problems // [])[]' "${evidence}/summary.json" | while IFS= read -r problem; do
                  echo "problem: ${problem}"
                done
                echo "evidence: ${evidence}/summary.json"
              fi
              if [ -d "${evidence}/steps" ]; then
                for step_file in "${evidence}"/steps/*.json; do
                  if [ ! -f "${step_file}" ]; then continue; fi
                  echo "check: $(jq -r '.id + "=" + .status' "${step_file}")"
                done
              fi
              echo "::error::The aggregate job of post-release verification run ${run_id} concluded ${aggregate}; the release stays draft. Evidence: ${evidence}" >&2
              exit 1
            fi
            if [ "${run_status}" = "completed" ]; then
              echo "::error::Post-release verification run ${run_id} completed without a successful aggregate job (aggregate='${aggregate}'); the release stays draft. Evidence: ${evidence}" >&2
              exit 1
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::Timed out waiting for the aggregate job of post-release verification run ${run_id}; the release stays draft." >&2
              exit 1
            fi
            sleep 30
          done
          wanted="post-release-verify-${RELEASE_TAG}-${run_id}-aggregate"
          artifact_deadline=$((SECONDS + 900))
          while :; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --paginate --jq '.artifacts[].name' > "${artifacts_file}"
            if grep -Fqx "${wanted}" "${artifacts_file}"; then
              echo "Verified post-release verification run ${run_id}: aggregate PASS, artifact ${wanted}. Publishing ${RELEASE_TAG}."
              exit 0
            fi
            if [ "${SECONDS}" -ge "${artifact_deadline}" ]; then
              echo "::error::Post-release verification run ${run_id} has no ${wanted} artifact; the release stays draft. available: $(tr '\n' ' ' < "${artifacts_file}")" >&2
              exit 1
            fi
            sleep 15
          done
      # This is the only publish action in the repository. Reaching it means the
      # draft verification aggregate is 15/15 and its artifact exists; any
      # earlier failure leaves the release a draft and never reaches this step.
      - name: Make the tag's release public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
      # The published body is what release consumers read, so re-read it from the
      # public release instead of trusting the checked-out notes. Read-only: it
      # asserts the zh-CN details block exists and that the English and Chinese
      # segments each carry this tag's version. The Full Changelog link sits
      # after the details block, so it can never satisfy either segment.
      - name: Assert the published release body is bilingual
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          workdir="${RUNNER_TEMP}/release-body-check"
          rm -rf "${workdir}"
          mkdir -p "${workdir}"
          body_file="${workdir}/body.md"
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body // ""' > "${body_file}"
          if [ ! -s "${body_file}" ]; then
            echo "::error::Published release ${RELEASE_TAG} has an empty body; refusing a single-language release body." >&2
            exit 1
          fi
          details_line=0
          summary_line=0
          close_line=0
          lineno=0
          while IFS= read -r line; do
            lineno=$((lineno + 1))
            if [ "${details_line}" -eq 0 ] && [ "${line#*<details>}" != "${line}" ]; then
              details_line="${lineno}"
            fi
            if [ "${summary_line}" -eq 0 ] && [ "${line#*<summary>简体中文</summary>}" != "${line}" ]; then
              summary_line="${lineno}"
            fi
            if [ "${line#*</details>}" != "${line}" ]; then
              close_line="${lineno}"
            fi
          done < "${body_file}"
          if [ "${details_line}" -eq 0 ] || [ "${summary_line}" -eq 0 ] || [ "${close_line}" -eq 0 ]; then
            echo "::error::Published release ${RELEASE_TAG} body is missing the zh-CN <details><summary>简体中文</summary> block; refusing a single-language release body." >&2
            exit 1
          fi
          if [ "${details_line}" -gt "${summary_line}" ] || [ "${summary_line}" -gt "${close_line}" ]; then
            echo "::error::Published release ${RELEASE_TAG} body has a malformed zh-CN details block (<details> ... <summary>简体中文</summary> ... </details>); refusing a malformed release body." >&2
            exit 1
          fi
          en_body="${workdir}/body.en.md"
          zh_body="${workdir}/body.zh-CN.md"
          head -n "$((details_line - 1))" "${body_file}" > "${en_body}"
          tail -n +"$((summary_line + 1))" "${body_file}" | head -n "$((close_line - summary_line - 1))" > "${zh_body}"
          if ! grep -Fq "${tag}" "${en_body}"; then
            echo "::error::Published release ${RELEASE_TAG} English segment does not carry the version ${tag}; refusing the bilingual body gate." >&2
            exit 1
          fi
          if ! grep -Fq "${tag}" "${zh_body}"; then
            echo "::error::Published release ${RELEASE_TAG} Chinese segment does not carry the version ${tag}; refusing the bilingual body gate." >&2
            exit 1
          fi
          echo "Verified the published ${RELEASE_TAG} body: zh-CN details block present and both language segments carry ${tag}."
      # A Release body is rendered on the tag page, so a relative notes link
      # (`./v0.2.16.zh-CN.md`) resolves against the repository root and 404s.
      # Read-only: extract every markdown link target, fail on any relative one,
      # and require both tag-pinned absolute language switch URLs.
      - name: Assert the published release body links are absolute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          workdir="${RUNNER_TEMP}/release-body-links"
          rm -rf "${workdir}"
          mkdir -p "${workdir}"
          body_file="${workdir}/body.md"
          links_file="${workdir}/links.txt"
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body // ""' > "${body_file}"
          if [ ! -s "${body_file}" ]; then
            echo "::error::Published release ${RELEASE_TAG} has an empty body; cannot verify its links." >&2
            exit 1
          fi
          node -e '
          const fs = require("node:fs")
          const body = fs.readFileSync(process.argv[1], "utf8")
          const pattern = /\[[^\]]*\]\(\s*([^)\s]+)(?:\s+"[^"]*")?\s*\)/g
          const targets = [...body.matchAll(pattern)].map((match) => match[1])
          fs.writeFileSync(process.argv[2], targets.map((target) => target + "\n").join(""))
          console.log("release body markdown links (" + process.argv[3] + "): " + targets.length)
          for (const target of targets) console.log("link: " + target)
          ' "${body_file}" "${links_file}" "${tag}"
          relative=0
          while IFS= read -r target; do
            case "${target}" in
              ./*|../*)
                echo "::error::Published release ${RELEASE_TAG} body links to the relative path '${target}'; a Release body resolves against the tag page, so every link must be an absolute URL." >&2
                relative=$((relative + 1))
                ;;
            esac
            if [[ "${target}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "::error::Published release ${RELEASE_TAG} body links to the tag-relative path '${target}'; a Release body resolves against the tag page, so every link must be an absolute URL." >&2
              relative=$((relative + 1))
            fi
          done < "${links_file}"
          en_switch="https://github.com/chaxiu/OpenCompare/blob/${tag}/docs/release-notes/${tag}.md"
          zh_switch="https://github.com/chaxiu/OpenCompare/blob/${tag}/docs/release-notes/${tag}.zh-CN.md"
          missing=0
          for wanted in "${en_switch}" "${zh_switch}"; do
            if ! grep -Fqx "${wanted}" "${links_file}"; then
              echo "::error::Published release ${RELEASE_TAG} body is missing the absolute language switch link ${wanted}; refusing a body whose language switch 404s." >&2
              missing=$((missing + 1))
            fi
          done
          if [ "${relative}" -ne 0 ] || [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          echo "Verified the published ${RELEASE_TAG} body links: $(wc -l < "${links_file}" | tr -d ' ') links, 0 relative, both absolute language switch URLs present."
      # Enforce exactly one public release per tag across every API page: a
      # leftover duplicate (or a stray draft/prerelease) fails the run instead of
      # silently advertising two releases.
      - name: Verify the tag has exactly one public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag_filter=".[][] | select(.tag_name == \"${RELEASE_TAG}\")"
          count="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate | jq -s "[${tag_filter}] | length")"
          drafts="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate | jq -s "[${tag_filter} | select(.draft)] | length")"
          prereleases="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate | jq -s "[${tag_filter} | select(.prerelease)] | length")"
          for value in "${count}" "${drafts}" "${prereleases}"; do
            if ! [[ "${value}" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not count the releases for ${RELEASE_TAG}; the GitHub API returned '${value}'." >&2
              exit 1
            fi
          done
          echo "releases for ${RELEASE_TAG}: ${count} (drafts: ${drafts}, prereleases: ${prereleases})"
          if [ "${count}" -ne 1 ] || [ "${drafts}" -ne 0 ] || [ "${prereleases}" -ne 0 ]; then
            echo "::error::Expected exactly one public non-prerelease release for ${RELEASE_TAG}, found ${count} (drafts: ${drafts}, prereleases: ${prereleases})." >&2
            exit 1
          fi
      # A single public release is not enough: its assets must cover all three
      # platforms plus the update metadata, and every versioned name must belong
      # to this tag. Only asset names are read; nothing is downloaded.
      - name: Assert the public release has every platform asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${RELEASE_TAG#v}"
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate | jq -s -r "[.[][] | select(.tag_name == \"${RELEASE_TAG}\")] | .[0].id // empty")"
          if [ -z "${release_id}" ]; then
            echo "::error::No release found for ${RELEASE_TAG} while checking its assets." >&2
            exit 1
          fi
          assets="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --paginate | jq -s -r '.[][] | .name')"
          if [ -z "${assets}" ]; then
            echo "::error::Release ${RELEASE_TAG} has no assets." >&2
            exit 1
          fi
          has_asset() {
            local suffix="$1"
            local name
            while IFS= read -r name; do
              if [ -n "${name}" ]; then
                case "${name}" in
                  *"${suffix}") return 0 ;;
                esac
              fi
            done <<< "${assets}"
            return 1
          }
          status=0
          for suffix in .dmg .zip .exe .AppImage .deb latest-mac.yml latest.yml latest-linux.yml; do
            if ! has_asset "${suffix}"; then
              echo "::error::Release ${RELEASE_TAG} is missing a ${suffix} asset." >&2
              status=1
            fi
          done
          # A suffix check is not enough for Windows: the macOS `-mac.zip` also
          # ends in .zip, so a missing portable zip would pass it. Both Windows
          # assets are verified by their exact, versioned names instead.
          has_exact_asset() {
            local wanted="$1"
            local name
            while IFS= read -r name; do
              if [ "${name}" = "${wanted}" ]; then return 0; fi
            done <<< "${assets}"
            return 1
          }
          for asset in "OpenCompare-Setup-${tag}.exe" "OpenCompare-${tag}-win-x64.zip"; do
            if ! has_exact_asset "${asset}"; then
              echo "::error::Release ${RELEASE_TAG} is missing the Windows asset ${asset}." >&2
              status=1
            fi
          done
          while IFS= read -r name; do
            if [ -z "${name}" ]; then continue; fi
            case "${name}" in
              latest*.yml) continue ;;
              *"${tag}"*) ;;
              *)
                echo "::error::Release asset ${name} does not carry the tag version ${tag}." >&2
                status=1
                ;;
            esac
          done <<< "${assets}"
          exit ${status}
      # Update metadata must describe assets this release really carries: a
      # mismatched files[].url is a dead download URL for update clients. GitHub
      # normalises spaces in uploaded asset names while electron-builder keeps the
      # template, so compare against the published asset name set instead of
      # trusting the build. Read-only and fail-closed: a dispatch re-run of a tag
      # whose metadata is stale is refused rather than published.
      - name: Assert latest*.yml urls match the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/release-metadata"
          rm -rf "${workdir}"
          mkdir -p "${workdir}"
          assets="${workdir}/assets.txt"
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' > "${assets}"
          if [ ! -s "${assets}" ]; then
            echo "::error::Release ${RELEASE_TAG} exposes no asset names; refusing to publish update metadata." >&2
            exit 1
          fi
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern 'latest*.yml' --dir "${workdir}"
          shopt -s nullglob
          files=("${workdir}"/latest*.yml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No latest*.yml asset found on release ${RELEASE_TAG}." >&2
            exit 1
          fi
          status=0
          for file in "${files[@]}"; do
            if ! ASSETS="${assets}" METADATA="${file}" node -e '
              const fs = require("fs")
              const names = new Set(
                fs.readFileSync(process.env.ASSETS, "utf8").split(/\r?\n/).map((name) => name.trim()).filter(Boolean)
              )
              const lines = fs.readFileSync(process.env.METADATA, "utf8").split(/\r?\n/)
              const refs = []
              let inFiles = false
              let inEntry = false
              for (const line of lines) {
                if (/^files:\s*$/.test(line)) {
                  inFiles = true
                  inEntry = false
                  continue
                }
                if (!inFiles) continue
                if (/^\S/.test(line)) {
                  inFiles = false
                  inEntry = false
                  continue
                }
                const entry = /^\s*-\s*url:\s*(.+?)\s*$/.exec(line)
                if (entry) {
                  inEntry = true
                  refs.push(entry[1])
                  continue
                }
                if (!inEntry) continue
                const key = /^\s+(url|path):\s*(.+?)\s*$/.exec(line)
                if (key) refs.push(key[2])
              }
              const missing = refs
                .map((ref) => ref.replace(/^"|"$/g, "").replace(/^\.\//, ""))
                .filter((name) => !names.has(name))
              if (refs.length === 0) {
                console.error("::error::" + process.env.METADATA + " declares no files[].url entries.")
                process.exit(1)
              }
              if (missing.length > 0) {
                for (const name of missing) {
                  console.error("::error::" + process.env.METADATA + " files[].url " + name + " is not a release asset.")
                }
                process.exit(1)
              }
              console.log(process.env.METADATA + " files[].url entries all match the release assets")
            '; then
              echo "::error::${file} update metadata points at files this release does not carry." >&2
              status=1
            fi
          done
          exit ${status}
      # Read-only: a complete release for this tag can still leave the public
      # "latest" pointer on an older version (for example when a dispatch
      # re-runs an older tag). The public surface must agree with the tag this
      # run just published, so the newest release has to be this very tag.
      # Nothing here writes to the remote.
      - name: Assert the tag is the latest published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest="$(gh release list --limit 1 --json tagName | jq -r '.[0].tagName // empty')"
          if [ -z "${latest}" ]; then
            echo "::error::Could not read the latest published release while publishing ${RELEASE_TAG}; refusing to publish without the latest-release check." >&2
            exit 1
          fi
          echo "latest published release: ${latest} (this tag: ${RELEASE_TAG})"
          if [ "${latest}" != "${RELEASE_TAG}" ]; then
            echo "::error::The latest published release is ${latest}, not ${RELEASE_TAG}; this tag is not the latest release." >&2
            exit 1
          fi
      # Public L1 is a post-publish check that the public surface still matches
      # the bytes this run hashed before uploading. It fetches this run's
      # build-time sha256 manifests and compares every asset digest through
      # `scripts/verify-release.mjs` (the one comparison rule); one sampled asset
      # is downloaded as a transport smoke. `draft=false`, `html_url` and every
      # `browser_download_url` 200 are still asserted here. It does NOT replace
      # or relax the 15 draft checks that gated the publish above.
      - name: Run the public L1 checks after publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/public-l1"
          rm -rf "${workdir}"
          mkdir -p "${workdir}"
          meta="${workdir}/release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "${meta}"
          draft="$(jq -r '.draft' "${meta}")"
          if [ "${draft}" != "false" ]; then
            echo "::error::Release ${RELEASE_TAG} is not public after publish (draft=${draft})." >&2
            exit 1
          fi
          html_url="$(jq -r '.html_url // empty' "${meta}")"
          if [ -z "${html_url}" ]; then
            echo "::error::Release ${RELEASE_TAG} exposes no html_url." >&2
            exit 1
          fi
          code="$(curl -sSIL -o /dev/null -w '%{http_code}' "${html_url}")"
          if [ "${code}" != "200" ]; then
            echo "::error::Public release URL ${html_url} returned HTTP ${code}." >&2
            exit 1
          fi
          jq -r '.assets[] | [.name, (.browser_download_url // ""), (.size // 0), (.digest // "")] | @tsv' "${meta}" > "${workdir}/assets.tsv"
          if [ ! -s "${workdir}/assets.tsv" ]; then
            echo "::error::Release ${RELEASE_TAG} exposes no public assets." >&2
            exit 1
          fi
          status=0
          while IFS=$'\t' read -r name url size digest; do
            if [ -z "${url}" ]; then
              echo "::error::Asset ${name} has no browser_download_url." >&2
              status=1
              continue
            fi
            asset_code="$(curl -sSIL -o /dev/null -w '%{http_code}' "${url}")"
            if [ "${asset_code}" != "200" ]; then
              echo "::error::Public asset ${name} at ${url} returned HTTP ${asset_code}." >&2
              status=1
            fi
          done < "${workdir}/assets.tsv"
          if [ "${status}" -ne 0 ]; then
            exit 1
          fi
          picked="$(jq -r '[.assets[] | select((.digest // "") != "")] | sort_by(.size // 0) | .[0] | [(.name // ""), (.browser_download_url // "")] | @tsv' "${meta}")"
          IFS=$'\t' read -r pick_name pick_url <<< "${picked}"
          if ! gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --pattern 'sha256-manifest-*' --dir "${workdir}/manifests"; then
            echo "::error::缺构建期 sha256 清单：public L1 未取回任何 sha256-manifest-*（release run ${GITHUB_RUN_ID}）." >&2
            exit 1
          fi
          sample_args=()
          if [ -n "${pick_name}" ] && [ -n "${pick_url}" ]; then
            curl -sSL -o "${workdir}/${pick_name}" "${pick_url}"
            sample_args=(--sample="${workdir}/${pick_name}")
          fi
          node scripts/verify-release.mjs --public-l1 --tag="${RELEASE_TAG}" \
            --release-json="${meta}" --sha256-manifest-dir="${workdir}/manifests" \
            --out="${workdir}/l1" ${sample_args[@]+"${sample_args[@]}"}
