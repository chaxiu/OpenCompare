name: post-release-verify

# Verification of one tag's release, in either of two transport modes:
#
#  - `mode=draft` (default) reads the release before it is public: metadata via
#    `releases/{id}` and every asset via `releases/assets/{id}` with an
#    authenticated octet-stream GET. `release.yml`'s `finalize` dispatches this
#    mode first and publishes only after the aggregate is 15/15.
#  - `mode=published` re-verifies an already public release through
#    `releases/tags/{tag}` and `gh release download`.
#
# Both modes drive the same `scripts/verify-release.mjs`, one job per platform,
# and archive every per-step JSON, log and the fail-closed summary. The check
# registry, `expected=15` and every judgment are identical across modes.
#
# The workflow holds no signing key and writes nothing: `contents: write` is
# only what GitHub requires to read a draft release and its assets; `actions:
# read` is only what `gh run download` needs to fetch the release run's
# build-time sha256 manifests. `gh` is used for `gh api` / `gh release
# download` / `gh run download` GETs only, and no step calls
# `gh release edit|upload|create|delete`, `git tag` or `git push`. Publishing is
# owned by `release.yml`'s `finalize` and happens after this run's aggregate
# passes, never before.
#
# Ordering: `verify` needs `spike`, so a runner that cannot boot Electron and
# expose a DevTools page stops the matrix before any platform leg runs.
#
# Triggering: only `workflow_dispatch`. Event listeners for a published release
# never fire here, because the release is published by a `GITHUB_TOKEN` call in
# `release.yml`, and GitHub events created by that token start no new run. The
# release workflow dispatches this one explicitly instead, so `inputs.tag` is
# mandatory and `run-name` repeats it for `gh run list` lookups.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (vX.Y.Z)
        required: true
      mode:
        description: Release transport mode (draft before publish / published re-check)
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - published
      release_run_id:
        description: release.yml run id that holds this tag's build-time sha256 manifests
        required: false
        default: ''
        type: string

run-name: post-release-verify ${{ inputs.tag }}

permissions:
  contents: write
  actions: read

env:
  TAG: ${{ inputs.tag }}
  MODE: ${{ inputs.mode }}
  RELEASE_RUN_ID: ${{ inputs.release_run_id }}

jobs:
  spike:
    name: spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # The same command shape on every OS: the platform difference (xvfb
      # ownership, --no-sandbox, --disable-dev-shm-usage) lives only in the
      # launch descriptor inside scripts/verify-release.mjs.
      - name: Boot Electron and connect over CDP
        run: node scripts/verify-release.mjs --tag="$TAG" --layer=ci --spike --out=verify-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-${{ env.TAG }}-${{ github.run_id }}-${{ matrix.os }}
          path: verify-out
          if-no-files-found: warn
          retention-days: 30

  verify:
    name: verify (${{ matrix.platform }})
    needs: spike
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # Read-only: the release run archived one manifest per target. Missing
      # artifacts are a hard stop, never a skipped digest comparison.
      - name: Fetch the build-time sha256 manifests
        if: inputs.release_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh run download "${RELEASE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --pattern 'sha256-manifest-*' --dir sha256-manifests; then
            echo "::error::缺构建期 sha256 清单：release run ${RELEASE_RUN_ID} 未取回任何 sha256-manifest-*." >&2
            exit 1
          fi
      - name: Verify the release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest_args=()
          if [ -n "${RELEASE_RUN_ID}" ]; then manifest_args=(--sha256-manifest-dir=sha256-manifests); fi
          node scripts/verify-release.mjs --tag="$TAG" --layer=ci --release-state="$MODE" --platform=${{ matrix.platform }} --out=verify-out ${manifest_args[@]+"${manifest_args[@]}"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-release-verify-${{ env.TAG }}-${{ github.run_id }}-${{ matrix.platform }}
          path: verify-out
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: aggregate
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: post-release-verify-${{ env.TAG }}-${{ github.run_id }}-*
          path: parts
      - name: Merge every job into one fail-closed summary
        run: node scripts/verify-release.mjs --tag="$TAG" --layer=ci --aggregate=parts --out=verify-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-release-verify-${{ env.TAG }}-${{ github.run_id }}-aggregate
          path: verify-out
          if-no-files-found: warn
          retention-days: 30
