# electron-builder packaging targets.
#
# Cross-platform artifacts are built on CI only (see .github/workflows/release.yml).
# On the macos runner the bundles are Developer ID signed and Apple notarized; the
# certificate and App Store Connect API key credentials are injected as
# environment variables (CSC_LINK / CSC_KEY_PASSWORD / APPLE_TEAM_ID /
# APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER) from GitHub Secrets and
# are never committed. Missing credentials fail the build instead of shipping an
# unsigned bundle (see docs/release-signing.md).
# Electron-vite emits the three process bundles into `out/`, which is what gets packed.
appId: com.opencompare.app
productName: OpenCompare
# `opencompare://compare?left=&right=` links: the macOS bundle gets the
# CFBundleURLTypes declaration from here, and Linux reuses it for the desktop entry.
protocols:
  - name: OpenCompare Compare Link
    schemes:
      - opencompare
directories:
  output: release
files:
  - out/**
  - package.json
# Self-made, replaceable brand PNG shipped inside the bundle so the window and
# macOS dock icon resolve to the same artwork as the packaged app icon.
extraResources:
  - from: build/icon.png
    to: icon.png
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # Developer ID Application signing (certificate via CSC_LINK / CSC_KEY_PASSWORD)
  # plus Apple notarization via an App Store Connect API key (APPLE_API_KEY points
  # at the decoded .p8 file, identified by APPLE_API_KEY_ID / APPLE_API_ISSUER).
  # Name only. electron-builder 26.17 rejects a "Developer ID Application:"
  # prefix and selects that certificate type itself.
  identity: 'Tao Zhu (3X4J53U6RY)'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # The default artifact name is "OpenCompare Setup 0.2.4.exe" (spaces). GitHub
  # rewrites spaces to dots on upload while latest.yml keeps the template, which
  # produced an update URL that 404s for every release since v0.2.2. Pin a
  # space-free name so the on-disk installer and files[].url agree.
  artifactName: '${productName}-Setup-${version}.${ext}'
linux:
  icon: build/icon.png
  category: Development
  desktop:
    entry:
      MimeType: x-scheme-handler/opencompare
  # `deb` requires an explicit maintainer (electron-builder falls back to
  # package.json author.email, which is not guaranteed to be present).
  maintainer: 'OpenCompare Contributors <chaxiu@users.noreply.github.com>'
  target:
    - AppImage
    - deb
# `--publish always` defaults to a draft release; publish to a real release so
# the tag's Release is visible outside the repository.
publish:
  provider: github
  releaseType: release
